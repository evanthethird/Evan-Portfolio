<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minecraft Music Rhythm - Evan Chin Portfolio</title>
  
  <!-- Google Fonts: Geist -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            geist: ['Geist', 'sans-serif'],
          },
        },
      },
    }
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Your custom CSS -->
  <link rel="stylesheet" href="../style.css" />
</head>
<body class="font-geist bg-black text-white">

  <!-- ==================== NAVBAR ==================== -->
  <nav id="navbar" class="fixed top-0 inset-x-0 z-50 transition-all duration-300 bg-black/80 backdrop-blur-xl">
    <div class="flex items-center justify-between px-6 py-5 md:px-12 lg:px-16">
      <a href="../index.html#work" class="flex items-center gap-2 text-sm text-white/70 hover:text-white transition-colors">
        <i data-lucide="arrow-left" class="h-4 w-4"></i>
        Back to Projects
      </a>
      <a href="../index.html#contact" class="rounded-lg bg-white px-5 py-2 text-sm font-medium text-black transition-all hover:scale-105 hover:bg-white/90">
        Contact Me
      </a>
    </div>
  </nav>

  <!-- ==================== HERO SECTION ==================== -->
  <section class="relative pt-24 pb-6 px-6 md:px-12 lg:px-16">
    <div class="max-w-5xl mx-auto">
      <div class="mb-4">
        <p class="text-xs sm:text-sm text-white/50 uppercase tracking-widest mb-3">Minecraft</p>
        <h1 class="text-4xl sm:text-5xl md:text-6xl font-medium leading-tight text-white mb-4">
          Minecraft Music Rhythm
        </h1>
        <p class="max-w-3xl text-sm sm:text-base text-white/60 leading-relaxed">
          Redstone-powered note block music sequencer built in Minecraft.
        </p>
      </div>
    </div>
  </section>

  <!-- ==================== VIDEO SECTION ==================== -->
  <section class="px-6 py-6 md:px-12 lg:px-16 bg-white/[0.03]">
    <div class="max-w-5xl mx-auto">
      <div class="mb-4">
        <p class="text-xs sm:text-sm text-white/50 uppercase tracking-widest mb-2">Music Rhythm</p>
        <h2 class="text-2xl sm:text-3xl font-medium text-white mb-2">Note Block Sequencer</h2>
      </div>

      <!-- 2 Videos Side by Side -->
      <div class="grid gap-4 sm:grid-cols-2 mt-4">
        <!-- Video 1 -->
        <div class="relative rounded-2xl overflow-hidden bg-black/40 aspect-video border border-white/5 group">
          <iframe 
            class="absolute inset-0 h-full w-full"
            src="https://player.mux.com/ABycP01g3qlvgdPJ01IHZVaFM8DnzAJ5Q4iyJaFkB02w0000"
            title="Robot Run 1"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>

        <!-- Video 2 -->
        <div class="relative rounded-2xl overflow-hidden bg-black/40 aspect-video border border-white/5 group">
          <iframe 
            class="absolute inset-0 h-full w-full"
            src="https://player.mux.com/AioCr00eWAItqkaY8oYA5URD0200Hv42zDGt00HXLYwWBUQ"
            title="Robot Run 2"
            frameborder="0"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        </div>
      </div>
    </div>
  </section>

  <!-- ==================== FOOTER ==================== -->
  <footer class="border-t border-white/5 px-6 py-8 md:px-12 lg:px-16">
    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-4">
      <p class="text-xs text-white/40">© 2026 Evan Chin. Portfolio website.</p>
      <div class="flex gap-6">
        <a href="../index.html#work" class="text-xs text-white/40 hover:text-white/70 transition-colors">Projects</a>
        <a href="../index.html#contact" class="text-xs text-white/40 hover:text-white/70 transition-colors">Contact</a>
      </div>
    </div>
  </footer>

  <!-- Scripts -->
  <script>
    lucide.createIcons();
  </script>
  <script src="../script.js"></script>
</body>
</html>
